name: macOS release

# Builds a relocatable macOS arm64 guacd (VNC only) for each pushed tag and
# attaches it to that tag's GitHub release as guacd-<tag>-macos-arm64.tar.gz.
on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install autoconf automake libtool pkgconf cairo jpeg-turbo libpng libvncserver ossp-uuid openssl@3 webp dylibbundler
      - name: Build and package
        run: scripts/macos-package.sh "${GITHUB_REF_NAME}" dist
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/macos-publish.sh "${GITHUB_REF_NAME}" dist
